name: verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv-ci
      - run: python -c "import os,subprocess; p='.venv-ci/Scripts/python.exe' if os.name=='nt' else '.venv-ci/bin/python'; subprocess.run([p,'-m','pip','install','-r','requirements.lock'],check=True)"
      - run: python -c "import os,subprocess; p='.venv-ci/Scripts/python.exe' if os.name=='nt' else '.venv-ci/bin/python'; subprocess.run([p,'-m','playwright','install','chromium','--with-deps'],check=True)"
      - run: python -c "import os,subprocess; p='.venv-ci/Scripts/python.exe' if os.name=='nt' else '.venv-ci/bin/python'; subprocess.run([p,'-m','scripts.verify_release','--require-isolated','--browser'],check=True)"
        env:
          STOCKFLOW_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: artifacts/releases/
